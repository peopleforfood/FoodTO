<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b7f3b"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FoodTO"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>FoodTO</title>
<link rel="preconnect" href="https://tiles.openfreemap.org"><link rel="stylesheet" href="maplibre-gl.css">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;font:16px system-ui,-apple-system,sans-serif;overscroll-behavior:none;color:#1d1d1f}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
:root{--g:#1b7f3b;--gl:#e8f3eb;--nav:calc(64px + env(safe-area-inset-bottom))}
#map{position:fixed;inset:0;bottom:var(--nav)}
#top{pointer-events:none;position:fixed;top:calc(10px + env(safe-area-inset-top));left:0;right:0;z-index:5}
#search,#results,.chip{pointer-events:auto}#search{margin:0 12px;display:flex;gap:8px;align-items:center;background:#fff;border-radius:26px;box-shadow:0 2px 8px #0003;padding:0 16px;height:50px}
#search input{flex:1;border:0;outline:0;font-size:17px;background:none;min-width:0}
#chips{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;scrollbar-width:none}#chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 14px;border-radius:19px;border:0;background:#fff;box-shadow:0 1px 4px #0003;font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:var(--g);color:#fff}
.fto{width:22px;height:22px;border-radius:6px;background:url(foodto-badge.webp) center/cover;flex:none;display:inline-block}.chip.on .fto{box-shadow:0 0 0 2px #fff}
.av{width:36px;height:36px;border-radius:18px;flex:none;color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}.rv{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #f2f2f2}.rv p{margin:4px 0 0;font-size:14px;line-height:1.35}.rv small{color:#888}.st{color:#f5a623;letter-spacing:1px}.prod{cursor:pointer}.note{background:#fff7e0;border-radius:10px;padding:10px 12px;font-size:13px;color:#7a5b00;margin-bottom:10px}
#results{margin:0 12px;background:#fff;border-radius:16px;box-shadow:0 2px 8px #0003;display:none;max-height:50vh;overflow:auto}
#results div{padding:14px 16px;border-bottom:1px solid #eee}#results small{color:#666}
.fab{position:fixed;right:14px;bottom:calc(var(--nav) + 18px);z-index:4;width:52px;height:52px;border-radius:26px;border:0;background:#fff;box-shadow:0 2px 8px #0004;font-size:22px}
.pin{width:44px;height:48px;display:flex;align-items:flex-end;justify-content:center;cursor:pointer}
.pin span{width:30px;height:30px;margin-bottom:6px;border-radius:50% 50% 50% 0;background:var(--g);transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 2px 6px #0006}
.pin.sel span{background:#d93025;width:36px;height:36px}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:8;height:var(--nav);padding-bottom:env(safe-area-inset-bottom);background:#fff;display:flex;border-top:1px solid #ddd}
#nav button{flex:1;border:0;background:none;font-size:12px;color:#666}#nav button b{display:block;font-size:22px;line-height:28px}#nav .on{color:var(--g);font-weight:600}
.sheet{position:fixed;left:0;right:0;bottom:var(--nav);z-index:7;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -4px 16px #0003;transform:translateY(calc(100% + var(--nav)));transition:transform .2s cubic-bezier(.2,.8,.2,1);will-change:transform;max-height:72vh;display:flex;flex-direction:column}
.sheet.open{transform:none}.grab{padding:10px 0 6px;touch-action:none}.grab i{display:block;width:44px;height:5px;border-radius:3px;background:#ccc;margin:auto}
.sb{overflow:auto;padding:0 20px 18px;overscroll-behavior:contain}
h2{margin:2px 0;font-size:21px}.cat{color:#666;font-size:14px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.bdg{background:#f3f3f3;border-radius:10px;padding:6px 10px;font-size:13px;display:flex;gap:6px;align-items:center}.bdg.na{color:#999}
.tabs{display:flex;border-bottom:1px solid #eee;margin:4px -20px 10px;padding:0 12px;position:sticky;top:0;background:#fff}
.tabs button{flex:1;border:0;background:none;padding:12px 0;font-size:15px;color:#666;border-bottom:3px solid transparent}.tabs .on{color:var(--g);border-color:var(--g);font-weight:600}
.row{display:flex;gap:12px;padding:9px 0;font-size:15px;border-bottom:1px solid #f2f2f2}.row b{width:22px;flex:none;text-align:center}
.acts{display:flex;gap:10px;margin:12px 0 4px}.acts a{flex:1;text-align:center;padding:14px;border-radius:12px;background:var(--g);color:#fff;text-decoration:none;font-weight:600}.acts a.sec{background:var(--gl);color:var(--g)}.acts a.off{opacity:.4;pointer-events:none}
.empty{color:#888;font-size:14px;padding:14px 0}.prod{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #f2f2f2}.prod small{color:#888}
.opts{padding:4px 20px 20px}.opts h3{margin:4px 0 12px}.opts button{display:block;width:100%;text-align:left;padding:15px;border:0;border-radius:12px;background:#f5f5f5;margin-bottom:8px;font-size:16px}.opts button.on{background:var(--gl);color:var(--g);font-weight:600}
#toast{position:fixed;top:45%;left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:12px 18px;border-radius:12px;z-index:20;display:none;text-align:center;max-width:80vw}
#count{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + 24px);z-index:4;background:#fff;border-radius:16px;padding:7px 14px;font-size:13px;box-shadow:0 1px 4px #0003}
#prod.sheet{z-index:9}.pimg{width:44px;height:44px;border-radius:8px;flex:none;object-fit:cover;background:#f2f2f2}.ph{display:flex;align-items:center;justify-content:center;color:#1b7f3b;font-weight:700;background:#e8f3eb}.prod{gap:10px;align-items:center}.pt{flex:1;min-width:0;font-size:14px}.pt small{font-size:12px}.cg{font-weight:700;font-size:13px;text-transform:uppercase;color:#555;padding:14px 0 4px;letter-spacing:.3px}.cg small{color:#999;font-weight:400}.cq{width:100%;height:44px;border:1px solid #ddd;border-radius:12px;padding:0 14px;font-size:16px;margin-bottom:4px}</style></head><body>
<div id="map"></div>
<div id="top"><div id="search">🔍<input id="q" placeholder="Search FoodTO businesses" autocomplete="off" enterkeyhint="search"></div><div id="results"></div>
<div id="chips"><button class="chip" data-f="score"><span class="fto"></span>FoodTO score</button><button class="chip" data-f="price">Price</button><button class="chip" data-f="dist">Distance</button><button class="chip" id="clear" style="display:none">✕ Clear</button></div></div>
<div id="count"></div>
<button class="fab" id="locate" aria-label="Locate me">◎</button>
<div class="sheet" id="card"><div class="grab"><i></i></div><div class="sb" id="cb"></div></div>
<div class="sheet" id="prod"><div class="grab"><i></i></div><div class="sb" id="pb"></div></div>
<div class="sheet" id="filt"><div class="grab"><i></i></div><div class="opts" id="fb"></div></div>
<nav id="nav"><button class="on"><b>🗺️</b>Map</button><button data-s><b>📷</b>Scan</button><button data-s><b>✨</b>Discover</button><button data-s><b>💬</b>Chat</button></nav>
<div id="toast"></div>
<script src="maplibre-gl.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let biz=[],sel=null,me=null,meMk=null;const F={score:null,price:null,dist:null},pins={};
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[-79.4145,43.6625],zoom:14.2,attributionControl:{compact:true},dragRotate:false,pitchWithRotate:false,fadeDuration:0});
map.touchZoomRotate.disableRotation();map.on('styleimagemissing',e=>{if(!map.hasImage(e.id))map.addImage(e.id,{width:1,height:1,data:new Uint8Array(4)})});
function toast(t,ms=1400){const x=$('#toast');x.textContent=t;x.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>x.style.display='none',ms)}
// sheets: tap handle or swipe down to close
function openS(el){document.querySelectorAll('.sheet.open').forEach(s=>s!==el&&!(el.id=='prod'&&s.id=='card')&&closeS(s));el.style.transform='';el.classList.add('open')}
function closeS(el){el.style.transform='';el.classList.remove('open');if(el.id=='card'&&sel){pins[sel.id].classList.remove('sel');sel=null}}
document.querySelectorAll('.sheet').forEach(s=>{const g=s.querySelector('.grab'),b=s.querySelector('.sb,.opts');let y0=null,dy=0;
 const start=e=>{y0=e.touches[0].clientY;dy=0;s.style.transition='none'};
 g.addEventListener('touchstart',start,{passive:true});
 b.addEventListener('touchstart',e=>{if(b.scrollTop<=0)start(e);else y0=null},{passive:true});
 s.addEventListener('touchmove',e=>{if(y0==null)return;dy=e.touches[0].clientY-y0;if(dy>0)s.style.transform=`translateY(${dy}px)`;else{dy=0;s.style.transform=''}},{passive:true});
 s.addEventListener('touchend',()=>{if(y0==null)return;s.style.transition='';dy>70?closeS(s):s.style.transform='';y0=null});
 g.addEventListener('click',()=>closeS(s))});
map.on('click',()=>document.querySelectorAll('.sheet.open').forEach(closeS));
const km=(a,b)=>{const R=6371,r=x=>x*Math.PI/180,dl=r(b[1]-a[1]),dg=r(b[0]-a[0]);const h=Math.sin(dl/2)**2+Math.cos(r(a[1]))*Math.cos(r(b[1]))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
const na='<span class="bdg na">';
function card(b,tab='overview'){
 const d=me?` · ${km(me,[b.lng,b.lat]).toFixed(1)} km`:'';
 const cr=b.community_review_count?`<span class="bdg"><span class="st">★</span> ${b.community_rating.toFixed(1)} <small>(${b.community_review_count} FoodTO review${b.community_review_count>1?'s':''})</small></span>`:na+'★ No reviews yet</span>';
 const sc=b.foodto_score!=null?`<span class="bdg"><span class="fto"></span><b>${b.foodto_score}</b>/100 FoodTO</span>`:na+'<span class="fto" style="opacity:.4"></span> Score pending</span>';
 const pp=b.price_point?`<span class="bdg">${esc(b.price_point)}</span>`:na+'$ Price: n/a</span>';
 let body='';
 if(tab=='overview')body=`${b.description?`<p style="margin:4px 0 8px;font-size:15px">${esc(b.description)}</p>`:''}
  <div class="row"><b>📍</b><span>${esc(b.address)}</span></div><div class="row"><b>🕒</b><span>${esc(b.hours).replace(/; /g,'<br>')}</span></div>
  <div class="row"><b>📞</b><span>${esc(b.phone)}</span></div>${b.website?`<div class="row"><b>🌐</b><a href="${esc(b.website)}" target="_blank" rel="noopener">${esc(b.website.replace(/^https?:\/\/(www\.)?/,'').replace(/\/$/,''))}</a></div>`:''}`;
 else if(tab=='reviews')body=b.reviews.length?b.reviews.map(r=>`<div class="rv"><div class="av" style="background:${col(r.user.name)}">${esc(r.user.avatar_initials)}</div><div><b>${esc(r.user.name)}</b> <small>${esc(r.user.handle||'')}</small><br><span class="st">${'★'.repeat(r.stars)}${'☆'.repeat(5-r.stars)}</span> <small>${fmtD(r.date)}${r.user.neighbourhood?' · '+esc(r.user.neighbourhood):''}</small><p>${esc(r.text)}</p></div></div>`).join(''):'<div class="empty">No FoodTO reviews yet.</div>';
 else body=catHTML(b);
 $('#cb').innerHTML=`<h2>${esc(b.name)}</h2><div class="cat">${esc(b.category)}${d}</div><div class="badges">${sc}${cr}${pp}</div>
 <div class="acts"><a href="https://www.google.com/maps/dir/?api=1&destination=${b.lat},${b.lng}" target="_blank">Directions</a><a class="sec ${b.phone?'':'off'}" href="tel:${b.phone.replace(/[^\d+]/g,'')}">Call</a></div>
 <div class="tabs">${['overview','reviews','catalogue'].map(t=>`<button data-t="${t}" class="${t==tab?'on':''}">${t[0].toUpperCase()+t.slice(1)}${t=='reviews'?` (${b.reviews.length})`:''}</button>`).join('')}</div>${body}`;
}
function pRow(p,i){const [t,tag]=p.name.split(' - ');return `<div class="prod" data-p="${i}">${p.image_url?`<img class="pimg" loading="lazy" decoding="async" src="${esc(p.image_url)}" alt="">`:`<div class="pimg ph">${esc((p.brand||p.name)[0])}</div>`}<div class="pt"><div>${esc(t)}</div><small>${esc([p.brand,p.size].filter(Boolean).join(' · '))}${tag?'<br>'+esc(tag):''}</small></div><span>${esc(p.price)} ›</span></div>`}
function catHTML(b,q='',inp=true){if(!b.products.length)return '<div class="empty">Catalogue not added yet.</div>';const t=q.trim().toLowerCase();const G={};b.products.forEach((p,i)=>{if(t&&!(p.name+' '+p.brand+' '+p.category+' '+p.subcategory).toLowerCase().includes(t))return;(G[p.category||'Other']??=[]).push(pRow(p,i))});
 const n=Object.values(G).reduce((a,g)=>a+g.length,0);return (b.products.length>8&&inp?`<input id="cq" class="cq" placeholder="Search ${b.products.length} products" autocomplete="off">`:'')+`<div id="cl">${Object.keys(G).sort().map(k=>`<div class="cg">${esc(k)} <small>${G[k].length}</small></div>${G[k].join('')}`).join('')||'<div class="empty">No matching products</div>'}</div>`}
$('#cb').addEventListener('input',e=>{if(e.target.id=='cq'&&sel){const h=catHTML(sel,e.target.value,false);$('#cl').outerHTML=h.slice(h.indexOf('<div id="cl">'))}});
const col=n=>`hsl(${[...n].reduce((a,c)=>a+c.charCodeAt(0),0)*47%360} 55% 42%)`,fmtD=d=>new Date(d+'T12:00').toLocaleDateString('en-CA',{month:'short',day:'numeric',year:'numeric'});
$('#cb').addEventListener('click',e=>{const t=e.target.closest('[data-t]');if(t&&sel)return card(sel,t.dataset.t);const p=e.target.closest('[data-p]');if(p&&sel)scorecard(sel,sel.products[p.dataset.p])});
function scorecard(b,p){const [t,tag]=p.name.split(' - ');const R=(k,v)=>v?`<div class="row"><b>${k}</b><span>${v}</span></div>`:'';
 $('#pb').innerHTML=`${p.image_url?`<img loading="lazy" src="${esc(p.image_url)}" style="width:100%;max-height:180px;object-fit:contain">`:''}<h2>${esc(t)}</h2><div class="cat">${esc(p.brand||'')}${p.size?' · '+esc(p.size):''} · at ${esc(b.name)}</div>${tag?`<p style="font-size:14px;color:#1b7f3b;margin:8px 0">${esc(tag)}</p>`:''}
 ${R('💲',esc(p.price))}${R('🏷️',esc([p.category,p.subcategory].filter(Boolean).join(' › ')))}${R('ℹ️',esc(p.details))}${R('#',esc(p.sku))}${p.product_url?R('🛒',`<a href="${esc(p.product_url)}" target="_blank" rel="noopener">View product</a>`):''}${p.brand_website?R('🌐',`<a href="${esc(p.brand_website)}" target="_blank" rel="noopener">${esc(p.brand||'Brand')} website</a>`):''}
 <div class="note" style="margin-top:12px">Full product scorecard: still being defined in the spec.</div>`;$('#pb').scrollTop=0;openS($('#prod'))}
function open(b){if(sel)pins[sel.id].classList.remove('sel');sel=b;pins[b.id].classList.add('sel');card(b);$('#cb').scrollTop=0;openS($('#card'));map.easeTo({center:[b.lng,b.lat],offset:[0,-140],duration:250})}
// filters
const FO={score:{t:'Minimum FoodTO score',o:[[null,'Any'],[80,'80+'],[60,'60+'],[40,'40+'],[20,'20+']]},price:{t:'Price point',o:[[null,'Any'],['$','$'],['$$','$$'],['$$$','$$$'],['$$$$','$$$$']]},dist:{t:'Distance from you',o:[[null,'Any'],[0.5,'Within 500 m'],[1,'Within 1 km'],[2,'Within 2 km'],[5,'Within 5 km']]}};
const pass=b=>(F.score==null||(b.foodto_score!=null&&b.foodto_score>=F.score))&&(F.price==null||b.price_point==F.price)&&(F.dist==null||(me&&km(me,[b.lng,b.lat])<=F.dist));
function apply(){let n=0;biz.forEach(b=>{const ok=pass(b);pins[b.id].style.display=ok?'':'none';n+=ok});
 document.querySelectorAll('[data-f]').forEach(c=>{const v=F[c.dataset.f];c.classList.toggle('on',v!=null);c.lastChild.textContent=v==null?{score:'FoodTO score',price:'Price',dist:'Distance'}[c.dataset.f]:FO[c.dataset.f].o.find(o=>o[0]===v)[1]});
 const any=Object.values(F).some(v=>v!=null);$('#clear').style.display=any?'':'none';$('#count').textContent=any?`${n} of ${biz.length} businesses`:`${biz.length} independent businesses`;
 if(any&&!n)toast(F.score!=null||F.price!=null?F.price!=null&&!biz.some(b=>b.price_point)?'No price data yet':'No matches':'No businesses in range',2200)}
document.querySelectorAll('[data-f]').forEach(c=>c.onclick=()=>{const k=c.dataset.f,f=FO[k];
 $('#fb').innerHTML=`<h3>${f.t}</h3>`+(k=='price'&&!biz.some(b=>b.price_point)?'<div class="note">No price points in the data yet, so this filter will show nothing.</div>':'')+f.o.map((o,i)=>`<button data-i="${i}" class="${F[k]===o[0]?'on':''}">${o[1]}</button>`).join('');
 $('#fb').onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;const v=f.o[b.dataset.i][0];
  const done=()=>{F[k]=v;apply();closeS($('#filt'))};
  if(k=='dist'&&v!=null&&!me)locate(done);else done()};
 openS($('#filt'))});
$('#clear').onclick=()=>{F.score=F.price=F.dist=null;apply()};
// search
const q=$('#q'),res=$('#results');
q.oninput=()=>{const t=q.value.trim().toLowerCase();const m=t?biz.filter(b=>[b.name,b.category,b.address,b.description,...b.products.map(p=>p.name)].join(' ').toLowerCase().includes(t)):[];
 res.innerHTML=m.map(b=>`<div data-id="${b.id}">${esc(b.name)}<br><small>${esc(b.category)} · ${esc(b.address)}</small></div>`).join('')||(t?'<div class="empty" style="padding:14px 16px">No matches</div>':'');res.style.display=t?'block':'none'};
res.onclick=e=>{const d=e.target.closest('[data-id]');if(!d)return;open(biz.find(b=>b.id==d.dataset.id));res.style.display='none';q.value='';q.blur()};
// locate
function locate(cb){if(!navigator.geolocation)return toast('Location not supported');toast('Finding you…',8000);
 navigator.geolocation.getCurrentPosition(p=>{me=[p.coords.longitude,p.coords.latitude];$('#toast').style.display='none';
  if(!meMk){const el=document.createElement('div');el.style.cssText='width:18px;height:18px;border-radius:9px;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 6px #1a73e833';meMk=new maplibregl.Marker({element:el})}
  meMk.setLngLat(me).addTo(map);map.flyTo({center:me,zoom:15,duration:500});cb&&cb()},()=>toast('Location unavailable. Allow location access to use this.',2200),{enableHighAccuracy:true,timeout:8000,maximumAge:60000})}
$('#locate').onclick=()=>locate(apply);
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>toast(b.textContent.replace(/\W+/u,'').trim()+' is coming soon'));
fetch('data.json').then(r=>r.json()).then(d=>{biz=d;d.forEach(b=>{const el=document.createElement('div');el.className='pin';el.innerHTML='<span></span>';el.dataset.id=b.id;
 el.addEventListener('click',e=>{e.stopPropagation();open(b)});pins[b.id]=el;new maplibregl.Marker({element:el,anchor:'bottom'}).setLngLat([b.lng,b.lat]).addTo(map)});const bb=new maplibregl.LngLatBounds();d.forEach(b=>bb.extend([b.lng,b.lat]));map.fitBounds(bb,{padding:{top:150,bottom:70,left:40,right:40},duration:0});apply()});
</script></body></html>
